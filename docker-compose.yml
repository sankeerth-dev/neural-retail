version: "3.9"

networks:
  neuralretail-net:
    driver: bridge

volumes:
  postgres_data:
  mlflow_artifacts:

services:
  postgres:
    image: postgres:17
    container_name: neuralretail-postgres
    environment:
      POSTGRES_DB: neuralretail
      POSTGRES_USER: nr_user
      POSTGRES_PASSWORD: nr_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - neuralretail-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nr_user -d neuralretail"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:8-alpine
    container_name: neuralretail-redis
    ports:
      - "6379:6379"
    networks:
      - neuralretail-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mlflow:
    build:
      context: ./infrastructure/mlflow
      dockerfile: Dockerfile
    container_name: neuralretail-mlflow
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      mlflow server
      --backend-store-uri postgresql://nr_user:nr_pass@postgres:5432/mlflow
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    networks:
      - neuralretail-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-init:
    image: apache/airflow:2.9.0
    container_name: neuralretail-airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://nr_user:nr_pass@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: "46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLt0nFZU9I="
      AIRFLOW__WEBSERVER__SECRET_KEY: "neuralretail-secret-key-2026"
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      bash -c "airflow db init &&
               airflow users create
               --username admin
               --password admin
               --firstname Admin
               --lastname User
               --role Admin
               --email admin@neuralretail.com"
    networks:
      - neuralretail-net

  airflow-webserver:
    image: apache/airflow:2.9.0
    container_name: neuralretail-airflow-webserver
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://nr_user:nr_pass@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: "46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLt0nFZU9I="
      AIRFLOW__WEBSERVER__SECRET_KEY: "neuralretail-secret-key-2026"
    ports:
      - "8080:8080"
    depends_on:
      - airflow-init
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs/airflow:/opt/airflow/logs
    networks:
      - neuralretail-net
    command: webserver
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  airflow-scheduler:
    image: apache/airflow:2.9.0
    container_name: neuralretail-airflow-scheduler
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://nr_user:nr_pass@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: "46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLt0nFZU9I="
      AIRFLOW__WEBSERVER__SECRET_KEY: "neuralretail-secret-key-2026"
    depends_on:
      - airflow-init
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs/airflow:/opt/airflow/logs
    networks:
      - neuralretail-net
    command: scheduler

  streamlit:
    build:
      context: ./infrastructure/streamlit
      dockerfile: Dockerfile
    container_name: neuralretail-streamlit
    ports:
      - "8501:8501"
    volumes:
      - ./src/serving/dashboard:/app
    networks:
      - neuralretail-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8501/_stcore/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
